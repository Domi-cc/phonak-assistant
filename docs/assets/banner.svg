<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Lara im Ohr</title>
  <desc id="d">Your AI assistant, in your hearing aid. Tap your ear, speak, listen. The phone stays locked, dark and in your pocket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1d1b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.185" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <!-- ear -->
  <g fill="none" stroke="url(#ear)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 176 262 C 146 232 128 190 138 146 C 149 98 196 70 244 80 C 296 92 322 138 310 186 C 302 218 272 228 264 254 C 257 278 264 298 240 306 C 221 312 203 303 196 288"/>
