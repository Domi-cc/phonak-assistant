    <circle cx="322" cy="92" r="38" fill="none" stroke="#f8fafc" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="468" y="128" font-size="78" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Lara im Ohr</text>
    <text x="472" y="178" font-size="29" font-weight="600" fill="#cbd5e1">Your AI assistant, in your hearing aid.</text>
    <text x="472" y="216" font-size="20" fill="#94a3b8">Tap your ear. Speak. Listen. The phone stays locked, dark and in your pocket.</text>
  </g>

